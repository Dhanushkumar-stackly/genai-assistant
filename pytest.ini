[pytest]

testpaths =
    day 1 to 4
    d5-8 genai assistant
    d9-d10 genai
    Genai 11-12
    Genai_13-14
    genai-day-15-16
    genai-day-17-18

norecursedirs =
    .git
    .venv
    venv
    __pycache__
    SAFE-BACKUP
    *.egg-info

python_files =
    test_*.py
    *_test.py

pythonpath =
    .
    day 1 to 4
    d5-8 genai assistant
    d9-d10 genai
    Genai 11-12
    Genai_13-14
    genai-day-15-16
    genai-day-15-16/day15
    genai-day-15-16/day16
    genai-day-15-16/eval
    genai-day-17-18
    genai-day-17-18/day17
    genai-day-17-18/day18

addopts = -ra

filterwarnings =
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\.testclient
